
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Synergyx Event Organizer</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-container">
        <section class="brand-panel" aria-label="StudioFlow branding">

            <video class="brand-video" autoplay muted loop playsinline>
                <source src="motions.mp4.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>

            <div class="brand-overlay"></div>

            <div class="brand-content">
                <h1>Synergyx Event Organizer</h1>
                <p>Turning Visions into Seamless Realities.</p>
            </div>

        </section>

        <section class="login-panel">

            <div class="login-content">
            <div class="login-logo">
            <img src="logoeo.png" alt="Synergyx Studio">
            </div>

                <div class="login-header">
                    <h2>Welcome back</h2>
                    <p>Enter your details to sign in to your account.</p>
                </div>

                <button type="button" class="google-button" aria-label="Sign in with SSO">
                    <img
                        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                        alt=""
                    >
                    <span>Sign in with SSO</span>
                </button>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="email">Email or Username</label>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <div class="password-heading">
                            <label for="password">Password</label>
                            <a href="#">Forgot password?</a>
                        </div>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="remember-me">
                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="signin-button">
                        Sign In
                    </button>

                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="#">Sign up</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
